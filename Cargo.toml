[package]
name = "whois42d-ng"
version = "2.2.0"
edition = "2024"
exclude = ["/resources/fixtures/**"]

[features]
default = ["systemd"]
systemd = ["dep:sd-notify", "dep:socket2"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
env_logger = "0.11"
ipnet = "2.12.0"
log = "0.4"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { version = "0.5", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
