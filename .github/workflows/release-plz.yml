name: Release PR

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    release-plz:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Make room for Nix
              uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
              with:
                  # release-plz still needs the runner's Rust toolchain.
                  hatchet-protocol: holster

            - name: Install Nix
              uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
              with:
                  extra_nix_config: |
                      build-dir = /nix/build

            - name: Install native deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pkg-config libsystemd-dev

            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  client-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Run release-plz (create tag)
              id: release
              run: |
                  git tag | sort > /tmp/tags-before.txt
                  nix shell nixpkgs#release-plz -c \
                    release-plz release --git-token "$GITHUB_TOKEN"
                  git fetch --tags origin
                  NEW_TAG="$(comm -13 /tmp/tags-before.txt <(git tag | sort))"
                  if [ -z "$NEW_TAG" ]; then
                    echo "released=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "released=true" >> "$GITHUB_OUTPUT"
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Run release-plz (create/update PR)
              if: steps.release.outputs.released != 'true'
              run: |
                  nix shell nixpkgs#release-plz -c \
                    release-plz release-pr --git-token "$GITHUB_TOKEN" --forge github
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
