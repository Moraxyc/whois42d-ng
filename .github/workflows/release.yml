name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g. v1.0.0)"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-musl
                      os: ubuntu-latest
                      flags: "--no-default-features"
                    - target: aarch64-unknown-linux-musl
                      os: ubuntu-24.04-arm
                      flags: "--no-default-features"
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-24.04
                      flags: ""
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-24.04-arm
                      flags: ""
                    - target: x86_64-pc-windows-gnu
                      os: ubuntu-latest
                      flags: "--no-default-features"
                    - target: x86_64-apple-darwin
                      os: macos-latest
                      flags: "--no-default-features"
                    - target: aarch64-apple-darwin
                      os: macos-latest
                      flags: "--no-default-features"
                    - target: riscv64gc-unknown-linux-gnu
                      os: ubuntu-latest
                      flags: "--no-default-features"

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag || '' }}
                  persist-credentials: false

            - name: Add Rust target
              run: rustup target add ${{ matrix.target }}

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-riscv64-linux-gnu mingw-w64

            - name: Install systemd dev library
              if: runner.os == 'Linux' && matrix.flags == ''
              run: sudo apt-get install -y libsystemd-dev

            - name: Build (Linux)
              if: runner.os == 'Linux'
              run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.flags }}
              env:
                  CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
                  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

            - name: Build (macOS)
              if: runner.os == 'macOS'
              run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.flags }}

            - name: Build Debian package
              if: runner.os == 'Linux' && matrix.flags == ''
              env:
                  CARGO_BUILD_TARGET: ${{ matrix.target }}
              run: |
                  sudo apt-get install -y debhelper dpkg-dev pkg-config jq
                  bash scripts/build-deb.sh

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: runner.os == 'Linux' && matrix.flags == ''
              with:
                  name: debian-${{ matrix.target }}
                  path: dist/*.deb
                  if-no-files-found: error

            - name: Package
              env:
                  TARGET: ${{ matrix.target }}
              run: |
                  dir="whois42d-ng-${TARGET}"
                  bin="whois42d-ng"
                  case "${TARGET}" in
                    *windows*) bin="whois42d-ng.exe" ;;
                  esac
                  mkdir -p "stage/${dir}"
                  cp "target/${TARGET}/release/${bin}" "stage/${dir}/"
                  cp LICENSE README.md "stage/${dir}/"
                  case "${TARGET}" in
                    *windows*)
                      (cd stage && zip -r "../${dir}.zip" "${dir}")
                      sha256sum "${dir}.zip" > "${dir}.zip.sha256"
                      ;;
                    *)
                      tar -C stage -czf "${dir}.tar.gz" "${dir}"
                      sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
                      ;;
                  esac

            - name: Set artifact file name
              id: artifact_name
              run: |
                  case "${{ matrix.target }}" in
                    *windows*) echo "suffix=zip" >> "$GITHUB_OUTPUT" ;;
                    *)         echo "suffix=tar.gz" >> "$GITHUB_OUTPUT" ;;
                  esac

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: whois42d-ng-${{ matrix.target }}
                  path: |
                      whois42d-ng-${{ matrix.target }}.${{ steps.artifact_name.outputs.suffix }}
                      whois42d-ng-${{ matrix.target }}.${{ steps.artifact_name.outputs.suffix }}.sha256

    release:
        name: Publish GitHub Release
        needs: build
        runs-on: ubuntu-latest
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag || '' }}
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  path: artifacts
                  pattern: whois42d-ng-*
                  merge-multiple: true

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  path: dist
                  pattern: debian-*
                  merge-multiple: true

            - name: Make room for Nix
              uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12

            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
              with:
                  extra_nix_config: |
                      build-dir = /nix/build

            - name: Generate Debian manifest
              run: |
                  nix run --inputs-from ./nix/dev moraxyc-repo#moraxyc-repo -- \
                    manifest --artifacts dist --project whois42d-ng --tag "$TAG"

            - name: Extract changelog section
              id: notes
              run: |
                  VERSION="${TAG#v}"
                  NOTES_FILE="$(mktemp)"
                  if [ -f CHANGELOG.md ]; then
                    awk -v v="$VERSION" '
                      $0 ~ "^## \\[?" v "\\]?" { flag=1; next }
                      /^## \[/ { if (flag) exit }
                      flag { print }
                    ' CHANGELOG.md > "$NOTES_FILE"
                  fi
                  [ -s "$NOTES_FILE" ] || echo "Release ${VERSION}" > "$NOTES_FILE"
                  echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  client-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Create release
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  NOTES_PATH: ${{ steps.notes.outputs.path }}
              run: |
                  gh release create "$TAG" --verify-tag \
                    --title "$TAG" --notes-file "$NOTES_PATH" \
                    artifacts/* dist/*
