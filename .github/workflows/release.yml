name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g. v1.0.0)"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    build:
        name: Build ${{ matrix.system }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - system: x86_64-linux
                      os: ubuntu-latest
                    - system: aarch64-linux
                      os: ubuntu-24.04-arm
                    - system: aarch64-darwin
                      os: macos-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: refs/tags/${{ inputs.tag || github.ref_name }}
                  persist-credentials: false

            - name: Make room for Nix
              if: runner.os == 'Linux'
              uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12

            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
              with:
                  extra_nix_config: ${{ runner.os == 'Linux' && 'build-dir = /nix/build' || '' }}

            - uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
              with:
                  endpoint: ${{ vars.ATTIC_ENDPOINT }}
                  cache: ${{ vars.ATTIC_CACHE }}
                  token: ${{ secrets.ATTIC_TOKEN }}
                  inputs-from: .

            - name: Check version
              env:
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  version=$(nix eval --raw .#whois42d-ng.version)
                  if [ "v$version" != "$TAG" ]; then
                    echo "::error::tag $TAG does not match Cargo.toml version $version"
                    exit 1
                  fi

            - name: Build
              run: |
                  bin=$(nix build -L .#whois42d-ng-static --print-out-paths)
                  mkdir -p dist/bin
                  install -m755 "$bin/bin/whois42d-ng" "dist/bin/whois42d-ng-${{ matrix.system }}-static"
                  if [ "$RUNNER_OS" = Linux ]; then
                    deb=$(nix build -L .#whois42d-ng-deb --print-out-paths)
                    install -Dm644 -t dist/deb "$deb"/*.deb
                  fi

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: whois42d-ng-${{ matrix.system }}
                  path: dist/
                  if-no-files-found: error

    release:
        name: Publish GitHub Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: refs/tags/${{ inputs.tag || github.ref_name }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  path: dist
                  pattern: whois42d-ng-*
                  merge-multiple: true

            - name: Make room for Nix
              uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12

            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
              with:
                  extra_nix_config: |
                      build-dir = /nix/build

            - name: Checksums
              run: |
                  (cd dist/bin && sha256sum -- *) > SHA256SUMS
                  (cd dist/deb && sha256sum -- *.deb) >> SHA256SUMS

            - name: Generate and verify Debian manifest
              run: |
                  for operation in manifest verify-artifacts; do
                    nix run --inputs-from ./nix/dev moraxyc-repo#moraxyc-repo -- \
                      "$operation" --artifacts dist/deb --project whois42d-ng --tag "$TAG"
                  done

            - name: Release notes
              run: |
                  nix run --inputs-from . nixpkgs#git-cliff -- \
                    --current --strip header --output notes.md

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$TAG" --verify-tag \
                    --title "$TAG" --notes-file notes.md \
                    dist/bin/* dist/deb/* SHA256SUMS
