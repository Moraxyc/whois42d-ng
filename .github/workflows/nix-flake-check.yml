name: Nix Flake Check

on:
    pull_request:
    push:
        branches: [master]
        paths:
            - "src/**"
            - "tests/**"
            - "resources/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "flake.nix"
            - "flake.lock"
            - "nix/**"
            - ".github/workflows/nix-flake-check.yml"

jobs:
    nix-flake-check:
        name: nix flake check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Make room for Nix
              uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12

            - name: Install Nix
              uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
              with:
                  extra_nix_config: |
                      build-dir = /nix/build

            - uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
              if: github.event_name == 'push'
              with:
                  endpoint: ${{ vars.ATTIC_ENDPOINT }}
                  cache: ${{ vars.ATTIC_CACHE }}
                  token: ${{ secrets.ATTIC_TOKEN }}
                  inputs-from: .

            - name: Run checks
              run: nix flake check
